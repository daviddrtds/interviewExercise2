<div class="app">
  <app-toast />
  <header class="header">
    <div class="header__logo">
      <span class="header__logoIcon material-icons"> audiotrack </span>
      <span class="header__logoText">Music Play</span>
    </div>
    <div class="header__user">
      <span class="header__userNotification material-icons"> notifications </span>
      <span class="header__userName">David Dias</span>
      <img src="user-avatar.jpg" alt="user avatar" class="header__userAvatar" />
      <span class="header__menuDropdown material-icons"> expand_more </span>
    </div>
  </header>

  <nav class="actions">
    <div class="actions__search">
      <input type="text" placeholder="Search artist" (input)="onSearch($event)" />
      <span class="actions__search-icon material-icons"> search </span>
    </div>
    <div class="actions__nav">
      <a
        class="actions__nav-pill"
        routerLink="/"
        routerLinkActive="actions__nav-pill--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="material-icons"> play_circle_outline </span>
        All Artists
      </a>
      <a
        class="actions__nav-pill"
        routerLink="/playlist"
        routerLinkActive="actions__nav-pill--active"
      >
        <span class="material-icons"> queue_music </span>
        Playlist
      </a>
      <a
        class="actions__nav-pill"
        routerLink="/algoritmo"
        routerLinkActive="actions__nav-pill--active"
      >
        <span class="material-icons"> extension </span>
        Algoritmo
      </a>
    </div>
  </nav>

  <h1 class="page-title">{{ pageTitle() }}</h1>

  <main class="main">
    @if (isMobile()) {
      <app-mobile-nav (toggled)="onNavToggle($event)" />
    }
    <div class="main__content" [class.main__content--shifted]="isMobileNavOpen()">
      <router-outlet />
    </div>
  </main>
</div>
